name: build-helper

# Build the Swift native helper on both supported architectures and, for a tag
# push, attach the binaries to the matching GitHub Release so that `reinstall.sh`
# can download them instead of requiring Xcode.
#
# Runner and toolchain choice is deliberate:
#   * `macos-26` is the arm64 image; `macos-14` is deprecated and goes away on
#     2026-11-02.
#   * Both architectures are cross-compiled on that one arm64 runner: the
#     `--arch x86_64` build was verified to produce a real Mach-O x86_64
#     executable, and macOS runners can execute it through Rosetta 2, so the
#     smoke test covers it too. Building x86_64 natively on `macos-15-intel`
#     would work as well, but GitHub is retiring its hosted Intel images, so
#     depending on them would make this workflow expire.
#   * The image pins Xcode 26.6 / Swift 6.3.3. Newer Swift is required, not a
#     preference: with the Swift 6.2 toolchain from Xcode 26.3 on the macos-15
#     image the Swift 6 language mode rejects SharedHelperServer.swift:131
#     ("sending 'self' risks causing data races"), a diagnostic that 6.3 no
#     longer reports for that code. `native/` is vendored, so the workflow pins
#     the toolchain instead of editing the sources.
#
# If `macos-26` rotates to an image without Xcode 26.6, the step below falls back
# to the newest Xcode present and the build fails loudly rather than silently
# shipping a differently-compiled binary.

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-helper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: macos-26
    permissions:
      contents: write # needed only by the release step, which is tag-gated below
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x86_64

    steps:
      - uses: actions/checkout@v4

      # Xcode 26.6 (Swift 6.3.3) is the toolchain this package is verified
      # against; see the header comment for why 6.2 is not enough. Fall back to
      # the newest other Xcode only so the failure mode stays readable, and print
      # the version either way.
      - name: Select Xcode
        run: |
          set -euo pipefail
          for candidate in \
            /Applications/Xcode_26.6.app \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.3.app; do
            if [ -d "$candidate" ]; then
              echo "selecting $candidate"
              sudo xcode-select --switch "$candidate"
              break
            fi
          done
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Check toolchain
        run: |
          set -euo pipefail
          version=$(swift -version 2>&1 | sed -n 's/.*Apple Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)
          echo "Swift $version"
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          if [ "$major" -lt 6 ] || { [ "$major" -eq 6 ] && [ "$minor" -lt 3 ]; }; then
            echo "::error::Swift 6.3 or newer is required; found $version (see the workflow header)"
            exit 1
          fi

      # The helper is a helper, not a GUI app, and it is ad-hoc signed when built
      # locally; sign it ad hoc here too so the committed and CI artifacts look
      # the same to Gatekeeper and to code that inspects code signatures.
      - name: Build helper
        run: |
          set -euo pipefail
          xcrun swift build \
            --package-path native \
            --scratch-path "$PWD/native/.build/ci-${{ matrix.arch }}" \
            --configuration release \
            --product dsh-cua-native \
            --arch "${{ matrix.arch }}"
          bin_dir=$(xcrun swift build \
            --package-path native \
            --scratch-path "$PWD/native/.build/ci-${{ matrix.arch }}" \
            --configuration release \
            --arch "${{ matrix.arch }}" \
            --show-bin-path)
          echo "BIN_DIR=$bin_dir" >> "$GITHUB_ENV"
          cp "$bin_dir/dsh-cua-native" "dsh-cua-native-darwin-${{ matrix.arch }}"
          chmod 755 "dsh-cua-native-darwin-${{ matrix.arch }}"
          codesign --force --sign - --identifier dsh-cua-native \
            "dsh-cua-native-darwin-${{ matrix.arch }}"

      - name: Verify helper
        run: |
          set -euo pipefail
          asset="dsh-cua-native-darwin-${{ matrix.arch }}"
          echo "== file =="
          file "$asset"
          echo "== codesign =="
          codesign -dv --verbose=2 "$asset" 2>&1 || true
          # Fail the job if the wrong architecture came out of the build.
          lipo -info "$asset" | grep -q "${{ matrix.arch }}"

          # Runtime smoke test: the helper parses its options before it touches
          # any AX or ScreenCaptureKit API. An unknown option therefore proves
          # that the executable loaded and ran, and that the argument parser is
          # reachable, without needing a GUI session or granted permissions.
          #
          # Both arches are built on the arm64 runner, so the x86_64 binary needs
          # Rosetta 2 to run here. It is present on macOS runners; `arch -x86_64`
          # makes the requirement explicit rather than relying on the kernel
          # translating transparently.
          #
          # `swift test` is deliberately not run in CI: the suite drives real AX
          # and ScreenCaptureKit APIs and needs a logged-in GUI session with
          # Accessibility and Screen Recording grants, which a hosted runner does
          # not provide.
          runner_prefix=""
          if [ "${{ matrix.arch }}" = "x86_64" ] && [ "$(uname -m)" = "arm64" ]; then
            runner_prefix="arch -x86_64"
            /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          fi
          set +e
          out=$($runner_prefix "./$asset" --ci-smoke-probe yes 2>&1)
          rc=$?
          set -e
          echo "smoke rc=$rc"
          echo "smoke out=$out"
          [ "$rc" -eq 1 ]
          printf '%s' "$out" | grep -q "Unknown helper option"
          echo "smoke OK: helper ran and rejected an unknown option as expected"

      - name: Compute checksum
        run: |
          set -euo pipefail
          asset="dsh-cua-native-darwin-${{ matrix.arch }}"
          shasum -a 256 "$asset" | tee "$asset.sha256"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          {
            echo "### dsh-cua-native ${{ matrix.arch }}"
            echo ""
            echo '```'
            cat "$asset.sha256"
            echo '```'
            echo ""
            ls -l "$asset"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-cua-native-darwin-${{ matrix.arch }}
          path: |
            dsh-cua-native-darwin-${{ matrix.arch }}
            dsh-cua-native-darwin-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 30

      # Only a tag push publishes. Pull requests and manual dispatches build and
      # verify, so a broken helper is caught before a tag is cut.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsh-cua-native-darwin-${{ matrix.arch }}
            dsh-cua-native-darwin-${{ matrix.arch }}.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
